[package]
name = "bevy_fps_controller"
version = "20.0.0"
edition = "2021"
authors = ["bevy_fps_controller"]
repository = "https://github.com/qhdwight/bevy_fps_controller"
categories = ["game-engines"]
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Bevy plugin that adds a Source engine inspired FPS movement controller"

[dependencies]
bevy = "0.20"
bevy_rapier3d = { version = "0.37", optional = true }
avian3d = { version = "0.8", default-features = false, optional = true }

[features]
default = []
avian-f32 = ["dep:avian3d", "avian3d/3d", "avian3d/parry-f32"]
avian-f64 = ["dep:avian3d", "avian3d/3d", "avian3d/f64", "avian3d/parry-f64"]
rapier = ["dep:bevy_rapier3d"]

[[example]]
name = "minimal_avian"
path = "examples/minimal_avian.rs"
required-features = ["avian"]

[[example]]
name = "minimal_rapier"
path = "examples/minimal_rapier.rs"
required-features = ["rapier"]
